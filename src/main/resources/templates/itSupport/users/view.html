<!DOCTYPE html>
<html>
<head>
    <title>View User</title>
</head>
<body>
    <h1>User Details</h1>
    
    <table border="1">
        <tr>
            <td>ID:</td>
            <td th:text="${user.id}"></td>
        </tr>
        <tr>
            <td>Email:</td>
            <td th:text="${user.email}"></td>
        </tr>
        <tr>
            <td>First Name:</td>
            <td th:text="${user.firstName}"></td>
        </tr>
        <tr>
            <td>Last Name:</td>
            <td th:text="${user.lastName}"></td>
        </tr>
        <tr>
            <td>Role:</td>
            <td th:text="${user.role}"></td>
        </tr>
        <tr>
            <td>Status:</td>
            <td th:text="${user.status}"></td>
        </tr>
        <tr>
            <td>Phone Number:</td>
            <td th:text="${user.phoneNumber}"></td>
        </tr>
    </table>
    
    <p>
        <a th:href="@{/itsupport/users/edit/{id}(id=${user.id})}">Edit User</a> |
        <a href="/itsupport/users">Back to Users List</a>
    </p>
</body>
</html>
