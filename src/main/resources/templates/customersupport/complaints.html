<!DOCTYPE html>
<html>
<head>
    <title>Complaint Management</title>
</head>
<body>
    <h1>Complaint Management</h1>
    
    <h2>Filter Complaints</h2>
    <form method="get">
        <label>Status: 
            <select name="status">
                <option value="">All</option>
                <option value="PENDING">Pending</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="RESOLVED">Resolved</option>
                <option value="CLOSED">Closed</option>
            </select>
        </label>
        <label>Category: 
            <select name="category">
                <option value="">All</option>
                <option value="SERVICE">Service</option>
                <option value="BOOKING">Booking</option>
                <option value="PAYMENT">Payment</option>
                <option value="DRIVER">Driver</option>
                <option value="OTHER">Other</option>
            </select>
        </label>
        <input type="submit" value="Filter">
    </form>
    
    <h2>Complaints List</h2>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Subject</th>
            <th>Category</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Created Date</th>
            <th>Actions</th>
        </tr>
        <tr th:each="complaint : ${complaints}">
            <td th:text="${complaint.id}"></td>
            <td th:text="${complaint.subject}"></td>
            <td th:text="${complaint.category}"></td>
            <td th:text="${complaint.priority}"></td>
            <td th:text="${complaint.status}"></td>
            <td th:text="${complaint.createdDate}"></td>
            <td>
                <a th:href="@{/customersupport/complaints/{id}(id=${complaint.id})}">View Details</a>
            </td>
        </tr>
    </table>
    
    <p><a href="/customersupport">Back to Dashboard</a></p>
</body>
</html>
