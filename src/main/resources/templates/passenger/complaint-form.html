<!DOCTYPE html>
<html>
<head>
    <title>Submit Complaint - Bus Booking System</title>
</head>
<body>
    <h1>Submit New Complaint</h1>
    
    <nav>
        <ul>
            <li><a href="/passenger">Dashboard</a></li>
            <li><a href="/passenger/complaints">My Complaints</a></li>
        </ul>
    </nav>
    
    <form th:action="@{/passenger/complaints}" method="post">
        <table>
            <tr>
                <td>Related Ticket:</td>
                <td>
                    <select name="ticketId">
                        <option value="">Select a ticket (optional)</option>
                        <option th:each="ticket : ${tickets}" th:value="${ticket.id}" 
                                th:text="${'Ticket #' + ticket.id + ' - ' + ticket.travelDate + ' - Seat ' + ticket.seatNumber}"></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Subject:</td>
                <td><input type="text" name="subject" required></td>
            </tr>
            <tr>
                <td>Category:</td>
                <td>
                    <select name="category" required>
                        <option value="">Select Category</option>
                        <option value="SERVICE">Service Quality</option>
                        <option value="BOOKING">Booking Issues</option>
                        <option value="PAYMENT">Payment Issues</option>
                        <option value="DRIVER">Driver Behavior</option>
                        <option value="VEHICLE">Vehicle Condition</option>
                        <option value="SCHEDULE">Schedule Problems</option>
                        <option value="OTHER">Other</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Priority:</td>
                <td>
                    <select name="priority" required>
                        <option value="">Select Priority</option>
                        <option value="LOW">Low</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="HIGH">High</option>
                        <option value="URGENT">Urgent</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Description:</td>
                <td><textarea name="description" rows="5" cols="50" required></textarea></td>
            </tr>
            <tr>
                <td colspan="2"><input type="submit" value="Submit Complaint"></td>
            </tr>
        </table>
    </form>
    
    <p><a href="/passenger/complaints">Back to Complaints</a></p>
</body>
</html>
